<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" fill="none">
  <defs>
    <linearGradient id="lovify-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F27691"/>
      <stop offset="100%" stop-color="#E94B68"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Mark: Heart morphed with dynamic music audio waveform -->
  <g transform="translate(6, 6)">
    <rect width="36" height="36" rx="10" fill="#19191F" stroke="#303039" stroke-width="1.2"/>
    <!-- Sound wave bars shaped in subtle heart/sound curve -->
    <path d="M12 24V18" stroke="url(#lovify-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M16 27V15" stroke="url(#lovify-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M20 29V13" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M24 27V15" stroke="url(#lovify-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M28 24V18" stroke="url(#lovify-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="20" cy="10" r="1.5" fill="#F27691"/>
  </g>
  <!-- Brand Wordmark -->
  <text x="50" y="29" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.5">Lovi<tspan fill="#E94B68">fy</tspan></text>
</svg>