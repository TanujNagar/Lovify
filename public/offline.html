<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131316" />
    <title>Offline · Lovify</title>
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        src: url('/fonts/plus-jakarta-sans-latin.woff2') format('woff2');
        font-weight: 200 800;
        font-display: swap;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at 18% 5%, rgba(249, 87, 115, 0.16), transparent 42%),
          radial-gradient(circle at 88% 88%, rgba(135, 35, 63, 0.22), transparent 46%),
          #131316;
        color: #e5e1e6;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 24%;
        box-shadow: 0 0 40px rgba(249, 87, 115, 0.24);
      }
      h1 { font-size: 28px; line-height: 36px; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { font-size: 14px; line-height: 22px; color: #e1bec0; margin: 0 auto; max-width: 300px; }
      .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; }
      button, a {
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
      button { border: 0; background: #f95773; color: #5b001a; }
      a { background: #2a2a2d; color: #e5e1e6; }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 24px;
        padding: 6px 14px;
        border-radius: 9999px;
        background: #1b1b1e;
        color: #a8898b;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: #f95773; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>You're offline</h1>
      <p>The Lovify shell and your saved library are still here. Tracks that need the network will wait until you reconnect.</p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Try again</button>
        <a href="/">Open Lovify</a>
      </div>
      <div class="status"><span class="dot"></span> Offline mode · Lovify shell</div>
    </main>
  </body>
</html>
